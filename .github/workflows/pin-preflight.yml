name: Spin source provenance self-tests
on:
  pull_request:
    paths:
      - 'scripts/check-pins.sh'
      - 'scripts/compiler.sh'
      - 'scripts/test.sh'
      - 'scripts/test-preflight.sh'
      - '.github/workflows/pin-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check-pins.sh'
      - 'scripts/compiler.sh'
      - 'scripts/test.sh'
      - 'scripts/test-preflight.sh'
      - '.github/workflows/pin-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Shell syntax
        run: |
          for script in scripts/check-pins.sh scripts/compiler.sh scripts/test.sh scripts/test-preflight.sh; do
            bash -n "$script"
          done
      - name: Mocked admission regressions (not native Oreslang execution)
        run: bash scripts/test-preflight.sh
