name: Spin sustained-client protocol check
on:
  push:
    branches:
      - perf/concurrency-actor-matrix-20261012
  pull_request:
    paths:
      - 'scripts/sustained-client.py'
      - 'tests/test-sustained-client.py'
      - '.github/workflows/sustained-client.yml'
  workflow_dispatch:
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and protocol regression
        run: |
          python -m py_compile scripts/sustained-client.py tests/test-sustained-client.py
          python -m unittest discover -s tests -p 'test-sustained-client.py' -v
