name: Spin sustained-client protocol check
on:
  push:
    branches:
      - perf/concurrency-actor-matrix-20261012
  pull_request:
    paths:
      - 'scripts/sustained-client.py'
      - 'tests/test-sustained-client.py'
      - 'tests/test-sustained-fixture.py'
      - 'tests/sustained-pool-server.ores'
      - '.github/workflows/sustained-client.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Syntax and protocol regression
        run: |
          python -m py_compile scripts/sustained-client.py scripts/run-sustained-comparison.py tests/test-sustained-client.py tests/test-sustained-fixture.py
          python tests/test-sustained-client.py -v
          python tests/test-sustained-fixture.py -v
